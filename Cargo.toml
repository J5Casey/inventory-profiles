# Inventory Profiles: a native mod on the Sunrise mod API. The
# launcher compiles this crate against the prebuilt SDK of the commit
# sunrise-mod.toml pins; the SDK dependency must be this exact path. For
# local checks against a developer base, link a checkout of the pin:
#   mkdir -p .sunrise/sdk && ln -s <checkout> .sunrise/sdk/api
# The engine's tests run without it (engine/).
[package]
name = "horizon-mod-inventory-profiles"
version = "1.1.0"
edition = "2024"
authors = ["CayMac"]
license = "MIT"
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
